<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Ontology · 平台搭建映射</title>
<link rel="stylesheet" href="style.css?v=20">
<link rel="stylesheet" href="builder.css?v=2">
<link rel="stylesheet" href="mapping.css?v=11">
</head>
<body>
<header>
  <div class="brand">Easy Ontology<span class="sub">平台搭建映射</span></div>
  <div id="ws-bar" class="ws-bar"></div>
  <div class="header-right">
    <span id="save-status" class="ontop-info">加载中…</span>
    <a class="btn" href="/">← 返回控制台</a>
  </div>
</header>

<!-- 闸门：本体 + 数据源连通 + 表结构，全过才进向导 -->
<section id="gate" class="panel gate-panel">
  <h2>准备检查</h2>
  <ul id="gate-list" class="gate-list"></ul>
  <div id="gate-error" class="error"></div>
  <div class="btn-row">
    <button class="btn primary" onclick="init()">重试</button>
    <a class="btn" href="/">回主页配置</a>
  </div>
</section>

<main id="wizard" class="wizard-main" style="display:none">
  <div id="stale-bar" class="warnbox" style="display:none"></div>

  <ol class="steps">
    <li id="stab-1" onclick="gotoStep(1)"><b>1</b> 类映射</li>
    <li id="stab-2" onclick="gotoStep(2)"><b>2</b> 对象属性</li>
    <li id="stab-3" onclick="gotoStep(3)"><b>3</b> 预览保存</li>
  </ol>

  <section id="step-1" class="panel wstep">
    <div class="step-head">
      <h2>步骤① 每个类选表、主键和数据属性</h2>
      <div class="btn-row">
        <button class="btn small" onclick="refreshSchema()">重新拉取表结构</button>
        <button class="btn primary small" onclick="gotoStep(2)">下一步 → 对象属性</button>
      </div>
    </div>
    <div class="step-cols">
      <div class="wlist-col">
        <h3>类（<span id="cnt-mapped">0</span>/<span id="cnt-classes">0</span> 已映射）</h3>
        <ul id="list-cls" class="blist"></ul>
      </div>
      <div class="wform-col">
        <h2 id="cls-title">在左侧选择类</h2>
        <div id="cls-form"></div>
      </div>
    </div>
  </section>

  <section id="step-2" class="panel wstep" style="display:none">
    <div class="step-head">
      <h2>步骤② 每个对象属性选外键表和列</h2>
      <div class="btn-row">
        <button class="btn small" onclick="gotoStep(1)">← 上一步</button>
        <button class="btn primary small" onclick="gotoStep(3)">下一步 → 预览保存</button>
      </div>
    </div>
    <div class="step-cols">
      <div class="wlist-col">
        <h3>对象属性（<span id="cnt-rel">0</span>/<span id="cnt-oprops">0</span> 已映射）</h3>
        <ul id="list-rel" class="blist"></ul>
      </div>
      <div class="wform-col">
        <h2 id="rel-title">在左侧选择对象属性</h2>
        <div id="rel-form"></div>
      </div>
    </div>
  </section>

  <section id="step-3" class="panel wstep" style="display:none">
    <div class="step-head">
      <h2>步骤③ 预览生成的映射（可直接修改）</h2>
      <div class="btn-row">
        <button class="btn small" onclick="gotoStep(2)">← 上一步</button>
        <button class="btn small" id="btn-fkcheck" onclick="fkCheck()">🔍 检查外键命中率</button>
        <button class="btn small" id="btn-regen" onclick="regen(true)">重新生成</button>
        <button class="btn primary small" id="btn-commit" onclick="commitMapping()">保存映射</button>
      </div>
    </div>
    <div id="commit-result" class="okbox" style="display:none"></div>
    <div id="gen-warnings" class="warnbox" style="display:none"></div>
    <div id="fk-result" class="warnbox" style="display:none"></div>
    <div class="step3-meta"><span id="gen-status" class="hint"></span><span class="hint">手改后点「保存映射」生效；回上一步再进来会按表单重新生成（覆盖手改）</span></div>
    <textarea id="obda-text" spellcheck="false" oninput="onObdaInput(this.value)"></textarea>
  </section>
</main>

<script src="mapping.js?v=17"></script>
<script src="ws.js?v=3"></script>
</body>
</html>
